name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Export static data
        run: npm run export:static-data

      - name: Audit catalog data structure
        run: npm run audit:catalog-quality

      - name: Audit ranking integrity
        run: npm run audit:ranking-integrity

      - name: Validate SEO publication gates
        run: npm run seo:validate

      - name: Build Next app
        run: npm run next:build

      - name: Build Sites app
        run: npm run build

      - name: Run test suite
        run: node --experimental-strip-types --test tests/*.test.mjs

      - name: Run browser regression suite
        run: npm run test:e2e
