name: Ingest Open Food Facts

on:
  workflow_dispatch:
    inputs:
      import_mode:
        description: "Import mode"
        type: choice
        required: true
        default: "dry-run"
        options:
          - "dry-run"
          - "write-to-supabase"
      market:
        description: "Catalog market"
        type: choice
        required: true
        default: "DE"
        options:
          - "DE"
          - "US"
      category_preset:
        description: "Catalog growth wave"
        type: choice
        required: true
        default: "core"
        options:
          - "core"
          - "plant-forward"
          - "everyday"
          - "all"
          - "custom"
      categories:
        description: "Category slugs separated by commas; used only for custom"
        type: string
        default: ""
      max_pages:
        description: "Pages per category"
        type: string
        default: "1"
      page_size:
        description: "Products per page"
        type: string
        default: "50"
  schedule:
    - cron: "17 3 * * 1"
    - cron: "17 3 * * 3"
    - cron: "17 3 * * 5"
    - cron: "47 3 * * 2"
    - cron: "47 3 * * 4"
    - cron: "47 3 * * 6"

concurrency:
  group: ingest-open-food-facts
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Resolve catalog growth plan
        id: plan
        env:
          CATALOG_SCHEDULE: ${{ github.event.schedule }}
          CATALOG_MARKET: ${{ inputs.market || 'DE' }}
          CATALOG_PRESET: ${{ inputs.category_preset || 'core' }}
          CATALOG_CUSTOM_CATEGORIES: ${{ inputs.categories || '' }}
          CATALOG_MAX_PAGES: ${{ inputs.max_pages || '1' }}
          CATALOG_PAGE_SIZE: ${{ inputs.page_size || '50' }}
        run: npm run resolve:catalog-plan

      - name: Ingest raw products
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OFF_USER_AGENT: ${{ secrets.OFF_USER_AGENT }}
          OFF_MARKET: ${{ steps.plan.outputs.market }}
          OFF_CATEGORY_SLUGS: ${{ steps.plan.outputs.categories }}
          OFF_MAX_PAGES: ${{ steps.plan.outputs.max_pages }}
          OFF_PAGE_SIZE: ${{ steps.plan.outputs.page_size }}
          OFF_REQUEST_DELAY_MS: "7000"
          OFF_CONTINUE_ON_CATEGORY_ERROR: "true"
          OFF_UPSERT_BATCH_SIZE: "100"
        run: |
          if [ "${{ inputs.import_mode || 'write-to-supabase' }}" = "dry-run" ]; then
            npm run ingest:off -- --dry-run
          else
            npm run ingest:off
          fi

      - name: Export static JSON from fixtures
        if: ${{ inputs.import_mode == 'dry-run' }}
        run: npm run export:static-data

      - name: Normalize products and calculate scores
        if: ${{ inputs.import_mode != 'dry-run' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CATALOG_MARKET: ${{ steps.plan.outputs.market }}
        run: npm run normalize:off

      - name: Export static JSON from Supabase
        if: ${{ inputs.import_mode != 'dry-run' }}
        env:
          STATIC_EXPORT_SOURCE: supabase
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run export:static-data

      - name: Audit production catalog quality
        if: ${{ inputs.import_mode != 'dry-run' }}
        env:
          CATALOG_AUDIT_MODE: production
        run: npm run audit:catalog-quality

      - name: Validate SEO publication gates
        run: npm run seo:validate

  deploy:
    needs: ingest
    if: ${{ github.event_name == 'schedule' || inputs.import_mode == 'write-to-supabase' }}
    uses: ./.github/workflows/vercel-production.yml
    secrets: inherit
