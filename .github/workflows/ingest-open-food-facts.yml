name: Ingest Open Food Facts

on:
  workflow_dispatch:
    inputs:
      import_mode:
        description: "Import mode"
        type: choice
        required: true
        default: "dry-run"
        options:
          - "dry-run"
          - "write-to-supabase"
      max_pages:
        description: "Pages per category"
        type: string
        default: "1"
      page_size:
        description: "Products per page"
        type: string
        default: "50"
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: ingest-open-food-facts
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Ingest raw products
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OFF_USER_AGENT: ${{ secrets.OFF_USER_AGENT }}
          OFF_COUNTRY: Germany
          OFF_MAX_PAGES: ${{ inputs.max_pages || '1' }}
          OFF_PAGE_SIZE: ${{ inputs.page_size || '50' }}
          OFF_REQUEST_DELAY_MS: "7000"
        run: |
          if [ "${{ inputs.import_mode || 'write-to-supabase' }}" = "dry-run" ]; then
            npm run ingest:off -- --dry-run
          else
            npm run ingest:off
          fi

      - name: Export static JSON from fixtures
        if: ${{ inputs.import_mode == 'dry-run' }}
        run: npm run export:static-data

      - name: Normalize products and calculate scores
        if: ${{ inputs.import_mode != 'dry-run' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run normalize:off

      - name: Export static JSON from Supabase
        if: ${{ inputs.import_mode != 'dry-run' }}
        env:
          STATIC_EXPORT_SOURCE: supabase
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run export:static-data
