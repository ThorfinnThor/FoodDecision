name: Mirror Product Images

on:
  workflow_dispatch:
    inputs:
      market:
        description: "Catalog market"
        type: choice
        required: true
        default: "DE"
        options:
          - "DE"
          - "US"
      mirror_limit:
        description: "Maximum images for this run"
        type: string
        required: true
        default: "250"
      refresh_existing:
        description: "Refresh existing objects before filling the remaining limit"
        type: boolean
        required: true
        default: false
      publish_after_run:
        description: "Export, validate, and deploy the updated catalog after this batch"
        type: boolean
        required: true
        default: true

concurrency:
  group: mirror-product-images
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    outputs:
      catalog_timestamp: ${{ steps.catalog.outputs.timestamp }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Mirror licensed product images
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OFF_USER_AGENT: ${{ secrets.OFF_USER_AGENT }}
          CATALOG_MARKET: ${{ inputs.market }}
          IMAGE_MIRROR_LIMIT: ${{ inputs.mirror_limit }}
          IMAGE_MIRROR_REFRESH_EXISTING: ${{ inputs.refresh_existing }}
        run: npm run mirror:product-images

      - name: Export static JSON from Supabase
        id: catalog
        if: ${{ inputs.publish_after_run }}
        env:
          STATIC_EXPORT_SOURCE: supabase
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          npm run export:static-data
          node -e 'const fs=require("node:fs");const m=JSON.parse(fs.readFileSync("public/data/manifest.json","utf8"));fs.appendFileSync(process.env.GITHUB_OUTPUT,`timestamp=${m.generatedAt}\n`)'

      - name: Validate catalog and SEO
        if: ${{ inputs.publish_after_run }}
        run: |
          npm run audit:ranking-integrity
          npm run seo:validate

      - name: Build production application from the validated catalog
        if: ${{ inputs.publish_after_run }}
        run: npm run next:build:prepared

  deploy:
    if: ${{ inputs.publish_after_run }}
    needs: mirror
    uses: ./.github/workflows/vercel-production.yml
    with:
      expected_catalog_timestamp: ${{ needs.mirror.outputs.catalog_timestamp }}
    secrets: inherit
